name: validate library pr

on:
  pull_request:
    branches:
      - main
    paths:
      - 'libs/prayer-time-se/**'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: checkout repository
        uses: actions/checkout@v7

      - name: setup node
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: install dependencies
        run: bun install --frozen-lockfile

      - name: build the package
        run: bun run build
        working-directory: libs/prayer-time-se

      - name: run linter
        run: bun run lint
        working-directory: libs/prayer-time-se

      - name: run tests
        run: bun run test
        working-directory: libs/prayer-time-se

      - name: validate version matches root package.json
        run: |
          EXPECTED_VERSION=$(node -p "require('./package.json').version")
          AVAILABLE_VERSION=$(node -p "require('./libs/prayer-time-se/package.json').version")
          echo "Expected version: $EXPECTED_VERSION"
          echo "Available version: $AVAILABLE_VERSION"
          if [ "$AVAILABLE_VERSION" != "$EXPECTED_VERSION" ]; then
            echo "ERROR: Available version ($AVAILABLE_VERSION) must match expected version ($EXPECTED_VERSION)"
            exit 1
          fi
