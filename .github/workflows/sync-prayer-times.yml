name: Sync Prayer Times

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Fetch latest prayer times
        run: bun run sync
        working-directory: libs/update-times

      - name: Verify synced data
        run: bun run verify-sync
        working-directory: libs/update-times

      - name: Copy data to destinations
        run: bun run copy
        working-directory: libs/update-times

      - name: Verify all destinations
        run: bun run verify-copy
        working-directory: libs/update-times

      - name: Check for changes
        id: git-check
        run: |
          git diff --exit-code || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ apps/ libs/
          git commit -m "chore: update prayer times data [skip ci]"
          git push
